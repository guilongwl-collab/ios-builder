name: iOS WebView Unsigned Build Auto

on:
  push:
    branches:
      - main
    paths:
      - '.ios-build-dispatch/**'
  workflow_dispatch:
    inputs:
      package_url:
        description: Xcode 工程 ZIP 下载地址
        required: true
      app_name:
        description: App 显示名称
        required: false
      bundle_id:
        description: Bundle Identifier
        required: false
      web_url:
        description: WebView 网址
        required: false
      icon_url:
        description: App 图标下载地址，PNG/JPG，建议 1024x1024
        required: false
      task_no:
        description: 后台任务编号
        required: false

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout dispatch metadata
        uses: actions/checkout@v4

      - name: Resolve build inputs
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            cat > /tmp/inputs.json <<'JSON'
          {
            "package_url": "${{ github.event.inputs.package_url }}",
            "app_name": "${{ github.event.inputs.app_name }}",
            "bundle_id": "${{ github.event.inputs.bundle_id }}",
            "web_url": "${{ github.event.inputs.web_url }}",
            "icon_url": "${{ github.event.inputs.icon_url }}",
            "task_no": "${{ github.event.inputs.task_no }}"
          }
          JSON
          else
            DISPATCH_FILE=$(find .ios-build-dispatch -name "*.json" -type f | sort | tail -1)
            if [ -z "$DISPATCH_FILE" ]; then echo "No dispatch json found"; exit 1; fi
            cp "$DISPATCH_FILE" /tmp/inputs.json
          fi
          python3 - <<'PY'
          import json, os, shlex
          data = json.load(open('/tmp/inputs.json', encoding='utf-8'))
          keys = {
              'package_url': 'PACKAGE_URL',
              'app_name': 'APP_NAME',
              'bundle_id': 'BUNDLE_ID',
              'web_url': 'WEB_URL',
              'icon_url': 'ICON_URL',
              'task_no': 'TASK_NO',
          }
          with open('/tmp/inputs.env', 'w', encoding='utf-8') as sf, open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as gf:
              for k, env in keys.items():
                  v = str(data.get(k, '') or '')
                  sf.write('export %s=%s\n' % (env, shlex.quote(v)))
                  gf.write('%s=%s\n' % (env, v.replace('\n', ' ')))
          PY
          source /tmp/inputs.env
          if [ -z "$PACKAGE_URL" ]; then echo "Missing package_url"; exit 1; fi
          echo "Task: ${TASK_NO}"
          echo "Bundle ID: ${BUNDLE_ID}"
          echo "Web URL: ${WEB_URL}"

      - name: Download source package
        run: |
          set -e
          curl -L "$PACKAGE_URL" -o package.zip
          mkdir -p source
          unzip -q package.zip -d source
          find source -maxdepth 4 -type f | head -80

      - name: Patch app metadata and icon
        run: |
          set -e
          PROJECT=$(find source -name "*.xcodeproj" | head -1)
          if [ -z "$PROJECT" ]; then echo "No .xcodeproj found"; exit 1; fi
          if [ -n "$BUNDLE_ID" ]; then
            find source -name project.pbxproj -exec sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID/g" {} \;
          fi
          if [ -n "$WEB_URL" ]; then
            grep -RIl "{{WEB_URL}}\|https://kuangjia2.wenanku.cc/" source --include='*.swift' | xargs -I{} sed -i '' "s#{{WEB_URL}}#$WEB_URL#g; s#https://kuangjia2.wenanku.cc/#$WEB_URL#g" {} || true
          fi
          if [ -n "$APP_NAME" ]; then
            INFO_PLIST=$(find source -name Info.plist | head -1)
            if [ -n "$INFO_PLIST" ]; then
              /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName $APP_NAME" "$INFO_PLIST" || true
              /usr/libexec/PlistBuddy -c "Set :CFBundleName $APP_NAME" "$INFO_PLIST" || true
            fi
          fi
          if [ -n "$ICON_URL" ]; then
            curl -L "$ICON_URL" -o app_icon_input
            ASSET_DIR=$(find source -name "*.xcassets" -type d | head -1)
            if [ -z "$ASSET_DIR" ]; then echo "No Assets.xcassets found"; exit 1; fi
            ICON_SET="$ASSET_DIR/AppIcon.appiconset"
            rm -rf "$ICON_SET"
            mkdir -p "$ICON_SET"
            python3 - <<'PY' > "$ICON_SET/Contents.json"
          import json
          items=[]
          for idiom, sizes in {'iphone':['20','29','40','60'], 'ipad':['20','29','40','76','83.5']}.items():
              for size in sizes:
                  scales=['2x','3x'] if idiom=='iphone' else ['1x','2x']
                  if idiom=='ipad' and size=='83.5': scales=['2x']
                  for scale in scales:
                      px=int(float(size)*int(scale[0]))
                      items.append({'idiom':idiom,'size':size+'x'+size,'scale':scale,'filename':f'icon-{idiom}-{size}-{scale}.png','px':px})
          items.append({'idiom':'ios-marketing','size':'1024x1024','scale':'1x','filename':'icon-1024.png','px':1024})
          print(json.dumps({'images':[{k:v for k,v in x.items() if k!='px'} for x in items], 'info':{'version':1,'author':'xcode'}}, ensure_ascii=False, indent=2))
          PY
            python3 - <<'PY' > /tmp/icon_sizes.txt
          for idiom, sizes in {'iphone':['20','29','40','60'], 'ipad':['20','29','40','76','83.5']}.items():
              for size in sizes:
                  scales=['2x','3x'] if idiom=='iphone' else ['1x','2x']
                  if idiom=='ipad' and size=='83.5': scales=['2x']
                  for scale in scales:
                      print(int(float(size)*int(scale[0])), f'icon-{idiom}-{size}-{scale}.png')
          print(1024, 'icon-1024.png')
          PY
            while read -r px filename; do
              sips -z "$px" "$px" app_icon_input --out "$ICON_SET/$filename" >/dev/null
            done < /tmp/icon_sizes.txt
          fi

      - name: Patch WKWebView shell
        run: |
          set -e
          VC=$(find source -name "ViewController.swift" | head -1)
          if [ -n "$VC" ]; then
            cat > "$VC" <<'SWIFT'
          import UIKit
          import WebKit

          final class ViewController: UIViewController, WKNavigationDelegate, WKUIDelegate {
              private let defaultHomeURLString = "__WEB_URL__"
              private var webView: WKWebView!
              private let progressView = UIProgressView(progressViewStyle: .default)
              private let refreshControl = UIRefreshControl()
              private let lastURLKey = "IOSWebViewLastVisitedURL"

              private static let fixedTopbarScript = """
              (function(){
                function installStyle(){
                  try {
                    var id='ios-webview-fixed-topbar-style';
                    var old=document.getElementById(id);
                    if(old&&old.parentNode) old.parentNode.removeChild(old);
                    var css=`@media (max-width: 900px){
                      html,body{min-height:100%!important;-webkit-overflow-scrolling:touch!important;}
                      body.ios-native-webview .topbar, body.ios-native-webview header.topbar{
                        position:fixed!important;top:0!important;left:0!important;right:0!important;width:100%!important;
                        z-index:2147483000!important;transform:translateZ(0)!important;-webkit-transform:translateZ(0)!important;
                        background:rgba(255,255,255,.98)!important;-webkit-backdrop-filter:blur(12px)!important;backdrop-filter:blur(12px)!important;
                      }
                      body.ios-native-webview .main{padding-top:calc(100px + env(safe-area-inset-top,0px))!important;}
                      body.ios-native-webview .top-user, body.ios-native-webview .top-user-dropdown{z-index:2147483200!important;}
                    }`;
                    var style=document.createElement('style');style.id=id;style.appendChild(document.createTextNode(css));
                    (document.head||document.documentElement).appendChild(style);
                    if(document.body) document.body.classList.add('ios-native-webview');
                  } catch(e) {}
                }
                if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',installStyle);}else{installStyle();}
                setTimeout(installStyle,300);setTimeout(installStyle,1000);setTimeout(installStyle,2200);
              })();
              """

              override func loadView() {
                  let userContentController = WKUserContentController()
                  userContentController.addUserScript(WKUserScript(source: Self.fixedTopbarScript, injectionTime: .atDocumentEnd, forMainFrameOnly: true))
                  let configuration = WKWebViewConfiguration()
                  configuration.websiteDataStore = WKWebsiteDataStore.default()
                  configuration.userContentController = userContentController
                  configuration.allowsInlineMediaPlayback = true
                  configuration.mediaTypesRequiringUserActionForPlayback = []
                  webView = WKWebView(frame: .zero, configuration: configuration)
                  webView.navigationDelegate = self
                  webView.uiDelegate = self
                  webView.allowsBackForwardNavigationGestures = true
                  webView.scrollView.contentInsetAdjustmentBehavior = .automatic
                  webView.scrollView.keyboardDismissMode = .interactive
                  view = webView
              }

              override func viewDidLoad() {
                  super.viewDidLoad()
                  setupProgressView()
                  setupRefreshControl()
                  loadInitialPage()
              }

              deinit { webView.removeObserver(self, forKeyPath: #keyPath(WKWebView.estimatedProgress)) }

              private func setupProgressView() {
                  progressView.translatesAutoresizingMaskIntoConstraints = false
                  view.addSubview(progressView)
                  NSLayoutConstraint.activate([
                      progressView.topAnchor.constraint(equalTo: view.safeAreaLayoutGuide.topAnchor),
                      progressView.leadingAnchor.constraint(equalTo: view.leadingAnchor),
                      progressView.trailingAnchor.constraint(equalTo: view.trailingAnchor),
                      progressView.heightAnchor.constraint(equalToConstant: 2)
                  ])
                  webView.addObserver(self, forKeyPath: #keyPath(WKWebView.estimatedProgress), options: .new, context: nil)
              }

              private func setupRefreshControl() {
                  refreshControl.addTarget(self, action: #selector(reloadPage), for: .valueChanged)
                  webView.scrollView.refreshControl = refreshControl
              }

              private var homeURL: URL { URL(string: defaultHomeURLString) ?? URL(string: "https://kuangjia2.wenanku.cc/")! }

              private func loadInitialPage() {
                  if let saved = UserDefaults.standard.string(forKey: lastURLKey), let savedURL = URL(string: saved), shouldRestore(savedURL) {
                      load(url: savedURL)
                  } else {
                      load(url: homeURL)
                  }
              }

              private func load(url: URL) { webView.load(URLRequest(url: url)) }

              private func shouldRestore(_ url: URL) -> Bool {
                  guard let savedHost = url.host, let homeHost = homeURL.host else { return false }
                  return savedHost == homeHost || savedHost.hasSuffix("." + homeHost)
              }

              @objc private func reloadPage() { webView.reload() }

              override func observeValue(forKeyPath keyPath: String?, of object: Any?, change: [NSKeyValueChangeKey : Any]?, context: UnsafeMutableRawPointer?) {
                  guard keyPath == #keyPath(WKWebView.estimatedProgress) else { return }
                  progressView.progress = Float(webView.estimatedProgress)
                  progressView.isHidden = webView.estimatedProgress >= 1.0
                  if progressView.isHidden { progressView.progress = 0 }
              }

              func webView(_ webView: WKWebView, didFinish navigation: WKNavigation!) {
                  refreshControl.endRefreshing()
                  if let url = webView.url, shouldRestore(url), url.scheme?.hasPrefix("http") == true {
                      UserDefaults.standard.set(url.absoluteString, forKey: lastURLKey)
                  }
                  webView.evaluateJavaScript(Self.fixedTopbarScript, completionHandler: nil)
              }

              func webView(_ webView: WKWebView, didFail navigation: WKNavigation!, withError error: Error) { refreshControl.endRefreshing() }
              func webView(_ webView: WKWebView, didFailProvisionalNavigation navigation: WKNavigation!, withError error: Error) { refreshControl.endRefreshing() }

              func webView(_ webView: WKWebView, decidePolicyFor navigationAction: WKNavigationAction, decisionHandler: @escaping (WKNavigationActionPolicy) -> Void) {
                  if navigationAction.targetFrame == nil, let url = navigationAction.request.url {
                      webView.load(URLRequest(url: url)); decisionHandler(.cancel); return
                  }
                  decisionHandler(.allow)
              }
          }
          SWIFT
            python3 - "$VC" "$WEB_URL" <<'PY'
          import sys
          p = sys.argv[1]
          web = sys.argv[2] or 'https://kuangjia2.wenanku.cc/'
          s = open(p, encoding='utf-8').read().replace('__WEB_URL__', web)
          open(p, 'w', encoding='utf-8').write(s)
          PY
          fi

      - name: Build unsigned app
        run: |
          set -e
          PROJECT=$(find source -name "*.xcodeproj" | head -1)
          if [ -z "$PROJECT" ]; then echo "No .xcodeproj found"; exit 1; fi
          SCHEME=$(xcodebuild -list -project "$PROJECT" | awk '/Schemes:/{getline; gsub(/^ +| +$/, ""); print; exit}')
          if [ -z "$SCHEME" ]; then echo "No scheme found"; exit 1; fi
          mkdir -p build
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/DerivedData" \
            clean build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package unsigned IPA
        run: |
          set -e
          APP_PATH=$(find build/DerivedData -path "*/Build/Products/Release-iphoneos/*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then echo "No .app found"; find build/DerivedData -maxdepth 8 -type d | tail -50; exit 1; fi
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          SAFE_TASK_NO="${TASK_NO:-manual}"
          zip -qry "../unsigned-${SAFE_TASK_NO}.ipa" Payload
          cd ../..
          ls -lah build/*.ipa

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ios-ipa
          path: build/*.ipa
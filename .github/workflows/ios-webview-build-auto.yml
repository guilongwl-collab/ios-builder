name: iOS WebView Unsigned Build Auto

on:
  push:
    paths:
      - '.ios-build-dispatch/**'
  workflow_dispatch:
    inputs:
      package_url:
        description: Xcode 工程 ZIP 下载地址
        required: true
      app_name:
        description: App 显示名称
        required: false
      bundle_id:
        description: Bundle Identifier
        required: false
      web_url:
        description: WebView 网址
        required: false
      icon_url:
        description: App 图标下载地址，PNG/JPG，建议 1024x1024
        required: false
      task_no:
        description: 后台任务编号
        required: false

permissions:
  contents: read
  actions: read

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout dispatch metadata
        uses: actions/checkout@v4

      - name: Resolve build inputs
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 - <<'PY' > /tmp/inputs.json
          import json
          data = {
            "package_url": "${{ github.event.inputs.package_url }}",
            "app_name": "${{ github.event.inputs.app_name }}",
            "bundle_id": "${{ github.event.inputs.bundle_id }}",
            "web_url": "${{ github.event.inputs.web_url }}",
            "icon_url": "${{ github.event.inputs.icon_url }}",
            "task_no": "${{ github.event.inputs.task_no }}",
          }
          print(json.dumps(data, ensure_ascii=False))
          PY
          else
            DISPATCH_FILE=""
            if [ -d ".ios-build-dispatch" ]; then
              DISPATCH_FILE=$(find .ios-build-dispatch -name "*.json" -type f | sort | tail -1 || true)
            fi
            if [ -z "$DISPATCH_FILE" ]; then
              echo "No dispatch json found in current checkout."
              echo "This run was triggered without task inputs. Ignore this run and trigger again after installing the latest backend patch."
              git log --name-only -n 3 || true
              exit 64
            fi
            cp "$DISPATCH_FILE" /tmp/inputs.json
          fi
          python3 - <<'PY'
          import json, os, shlex
          data = json.load(open('/tmp/inputs.json', encoding='utf-8'))
          keys = {'package_url':'PACKAGE_URL','app_name':'APP_NAME','bundle_id':'BUNDLE_ID','web_url':'WEB_URL','icon_url':'ICON_URL','task_no':'TASK_NO'}
          with open('/tmp/inputs.env', 'w', encoding='utf-8') as sf, open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as gf:
              for k, env in keys.items():
                  v = str(data.get(k, '') or '').replace('\n', ' ').replace('\r', ' ')
                  sf.write('export %s=%s\n' % (env, shlex.quote(v)))
                  gf.write(f'{env}<<__IOS_BUILD_VALUE__\n{v}\n__IOS_BUILD_VALUE__\n')
          PY
          . /tmp/inputs.env
          if [ -z "$PACKAGE_URL" ]; then echo "Missing package_url"; exit 1; fi
          echo "Task: ${TASK_NO}"
          echo "Bundle ID: ${BUNDLE_ID}"
          echo "Web URL: ${WEB_URL}"
          echo "Icon URL: ${ICON_URL}"
          sw_vers || true
          xcodebuild -version || true

      - name: Download source package
        run: |
          set -Eeuo pipefail
          rm -rf source build package.zip package.headers wget.headers
          mkdir -p source build

          echo "Downloading source package..."
          echo "Package URL host: $(python3 - <<'PY'
          import os, urllib.parse
          print(urllib.parse.urlparse(os.environ.get('PACKAGE_URL','')).netloc)
          PY
          )"

          curl_exit=0
          http_code="000"
          set +e
          http_code=$(curl -L --fail             --retry 5             --retry-delay 5             --retry-all-errors             --connect-timeout 30             --max-time 300             -A "Mozilla/5.0 (GitHub Actions iOS Builder)"             -D package.headers             -w "%{http_code}"             -o package.zip             "$PACKAGE_URL")
          curl_exit=$?
          set -e

          echo "curl exit code: $curl_exit"
          echo "curl HTTP code: $http_code"
          if [ -f package.headers ]; then
            echo "curl response headers:"
            sed -n '1,40p' package.headers || true
            echo "curl Content-Type: $(grep -i '^content-type:' package.headers | tail -1 | tr -d '\r' || true)"
          fi

          if [ "$curl_exit" -ne 0 ]; then
            echo "curl download failed. Trying fallback downloader if available..."
            rm -f package.zip
            if command -v wget >/dev/null 2>&1; then
              set +e
              wget --tries=5 --waitretry=5 --timeout=30                 --user-agent="Mozilla/5.0 (GitHub Actions iOS Builder)"                 --server-response                 -O package.zip                 "$PACKAGE_URL" 2>wget.headers
              wget_exit=$?
              set -e
              echo "wget exit code: $wget_exit"
              if [ -f wget.headers ]; then
                echo "wget response headers:"
                sed -n '1,60p' wget.headers || true
              fi
              if [ "$wget_exit" -ne 0 ]; then
                echo "Both curl and wget failed while downloading source package."
                exit 56
              fi
            else
              echo "wget is not available on this runner."
              exit 56
            fi
          fi

          if [ ! -s package.zip ]; then
            echo "Downloaded package.zip is missing or empty."
            ls -lah package.zip 2>/dev/null || true
            exit 56
          fi

          echo "Downloaded package details:"
          ls -lah package.zip
          file package.zip || true
          unzip -t package.zip
          python3 - <<'PY'
          import os, sys, zipfile
          path = 'package.zip'
          size = os.path.getsize(path) if os.path.exists(path) else 0
          print('Downloaded ZIP size bytes:', size)
          if not zipfile.is_zipfile(path):
              print('Downloaded file is not a valid ZIP package')
              sys.exit(1)
          with zipfile.ZipFile(path) as z:
              bad = z.testzip()
              if bad:
                  print('ZIP test failed at', bad)
                  sys.exit(1)
              z.extractall('source')
          PY
          find source -maxdepth 5 -type f | sed 's#^#  #' | head -120

      - name: Patch app metadata and uploaded icon
        run: |
          set -e
          mkdir -p build
          PROJECT=$(find source -name "*.xcodeproj" -type d | head -1)
          if [ -z "$PROJECT" ]; then echo "No .xcodeproj found"; exit 1; fi
          echo "Xcode project: $PROJECT"
          python3 - <<'PY'
          import html, json, os, pathlib, re
          root = pathlib.Path('source')
          app = os.environ.get('APP_NAME','') or 'App'
          bundle = os.environ.get('BUNDLE_ID','') or ''
          web = os.environ.get('WEB_URL','') or ''
          def swift_string(v): return json.dumps(v, ensure_ascii=False)
          for pbx in root.rglob('project.pbxproj'):
              text = pbx.read_text(errors='ignore')
              if bundle:
                  text = re.sub(r'PRODUCT_BUNDLE_IDENTIFIER = [^;]+;', f'PRODUCT_BUNDLE_IDENTIFIER = {bundle};', text)
              text = re.sub(r'CODE_SIGN_STYLE = Automatic;', 'CODE_SIGN_STYLE = Manual;', text)
              pbx.write_text(text)
          for swift in root.rglob('AppConfig.swift'):
              text = swift.read_text(encoding='utf-8', errors='ignore')
              if app:
                  text = re.sub(r'static\s+let\s+appName\s*=\s*"[^"]*"', 'static let appName = ' + swift_string(app), text)
              if web:
                  text = re.sub(r'static\s+let\s+initialURLString\s*=\s*"[^"]*"', 'static let initialURLString = ' + swift_string(web), text)
              swift.write_text(text, encoding='utf-8')
          replacements = {'{{WEB_URL}}':web,'__WEB_URL__':web,'https://kuangjia2.wenanku.cc/':web,'{{APP_NAME}}':app,'__APP_NAME__':app,'{{BUNDLE_ID}}':bundle,'__BUNDLE_ID__':bundle}
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.swift','.plist','.storyboard','.xib'}: continue
              try: text = path.read_text(encoding='utf-8')
              except Exception: continue
              new = text
              for a,b in replacements.items():
                  if b: new = new.replace(a,b)
              if path.name == 'Info.plist' and app:
                  if '<key>CFBundleDisplayName</key>' in new:
                      new = re.sub(r'<key>CFBundleDisplayName</key>\s*<string>[^<]*</string>', '<key>CFBundleDisplayName</key>\n\t<string>'+html.escape(app)+'</string>', new)
              if new != text: path.write_text(new, encoding='utf-8')
          PY
          ASSET_DIR=$(find source -name "*.xcassets" -type d | head -1)
          if [ -n "$ASSET_DIR" ]; then
            mkdir -p "$ASSET_DIR/AccentColor.colorset"
            cat > "$ASSET_DIR/AccentColor.colorset/Contents.json" <<'JSON'
          {"colors":[{"idiom":"universal","color":{"color-space":"srgb","components":{"red":"0.239","green":"0.627","blue":"0.992","alpha":"1.000"}}}],"info":{"author":"xcode","version":1}}
          JSON
          fi
          if [ -n "$ICON_URL" ] && [ -n "$ASSET_DIR" ]; then
            echo "Downloading uploaded App icon parameter..."
            if curl -fL --retry 3 --retry-delay 2 --connect-timeout 30 "$ICON_URL" -o /tmp/app_icon_input; then
              if sips -g pixelWidth /tmp/app_icon_input >/dev/null 2>&1; then
                if sips -s format png /tmp/app_icon_input --out /tmp/app_icon_source.png >/dev/null 2>&1; then ICON_SOURCE=/tmp/app_icon_source.png; else ICON_SOURCE=/tmp/app_icon_input; fi
                ICON_SET="$ASSET_DIR/AppIcon.appiconset"; rm -rf "$ICON_SET"; mkdir -p "$ICON_SET"
                python3 - <<'PY' > "$ICON_SET/Contents.json"
          import json
          items=[]
          for idiom, sizes in {'iphone':['20','29','40','60'], 'ipad':['20','29','40','76','83.5']}.items():
              for size in sizes:
                  scales=['2x','3x'] if idiom=='iphone' else ['1x','2x']
                  if idiom=='ipad' and size=='83.5': scales=['2x']
                  for scale in scales:
                      px=int(float(size)*int(scale[0])); items.append({'idiom':idiom,'size':size+'x'+size,'scale':scale,'filename':f'icon-{idiom}-{size}-{scale}.png','px':px})
          items.append({'idiom':'ios-marketing','size':'1024x1024','scale':'1x','filename':'icon-1024.png','px':1024})
          print(json.dumps({'images':[{k:v for k,v in x.items() if k!='px'} for x in items], 'info':{'version':1,'author':'xcode'}}, ensure_ascii=False, indent=2))
          PY
                python3 - <<'PY' > /tmp/icon_sizes.txt
          for idiom, sizes in {'iphone':['20','29','40','60'], 'ipad':['20','29','40','76','83.5']}.items():
              for size in sizes:
                  scales=['2x','3x'] if idiom=='iphone' else ['1x','2x']
                  if idiom=='ipad' and size=='83.5': scales=['2x']
                  for scale in scales: print(int(float(size)*int(scale[0])), f'icon-{idiom}-{size}-{scale}.png')
          print(1024, 'icon-1024.png')
          PY
                while read -r px filename; do sips -z "$px" "$px" "$ICON_SOURCE" --out "$ICON_SET/$filename" >/dev/null; done < /tmp/icon_sizes.txt
                DISPLAY_SET="$ASSET_DIR/AppDisplayIcon.imageset"; rm -rf "$DISPLAY_SET"; mkdir -p "$DISPLAY_SET"
                sips -s format png /tmp/app_icon_input --out "$DISPLAY_SET/AppDisplayIcon.png" >/dev/null 2>&1 || cp "$ICON_SOURCE" "$DISPLAY_SET/AppDisplayIcon.png"
                cat > "$DISPLAY_SET/Contents.json" <<'JSON'
          {"images":[{"filename":"AppDisplayIcon.png","idiom":"universal","scale":"1x"}],"info":{"author":"xcode","version":1}}
          JSON
                echo "Uploaded App icon parameter has been written to AppIcon and AppDisplayIcon."
              else
                echo "Uploaded icon is not a valid image; keep source project icon and continue build."
              fi
            else
              echo "Icon download failed; keep source project icon and continue build."
            fi
          fi

      - name: Build unsigned app
        run: |
          set -e
          set -o pipefail
          mkdir -p build
          PROJECT=$(find source -name "*.xcodeproj" -type d | head -1)
          WORKSPACE=$(find source -name "*.xcworkspace" -type d | head -1)
          if [ -z "$PROJECT" ] && [ -z "$WORKSPACE" ]; then echo "No Xcode project/workspace found"; exit 1; fi
          if [ -n "$WORKSPACE" ]; then
            CONTAINER_ARGS=(-workspace "$WORKSPACE")
            xcodebuild -list -workspace "$WORKSPACE" 2>&1 | tee build/xcodebuild-list.log || true
            SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | awk '/Schemes:/{getline; gsub(/^ +| +$/, ""); print; exit}')
          else
            CONTAINER_ARGS=(-project "$PROJECT")
            xcodebuild -list -project "$PROJECT" 2>&1 | tee build/xcodebuild-list.log || true
            SCHEME=$(xcodebuild -list -project "$PROJECT" 2>/dev/null | awk '/Schemes:/{getline; gsub(/^ +| +$/, ""); print; exit}')
          fi
          TARGET=""
          if [ -z "$SCHEME" ] && [ -n "$PROJECT" ]; then
            TARGET=$(python3 - "$PROJECT" <<'PY'
          import re, sys, pathlib
          pbx = pathlib.Path(sys.argv[1]) / 'project.pbxproj'
          text = pbx.read_text(errors='ignore') if pbx.exists() else ''
          m = re.search(r'/\* Begin PBXNativeTarget section \*/.*?\n\s*[A-Fa-f0-9]+ /\* ([^*]+) \*/ = \{\n\s*isa = PBXNativeTarget;', text, re.S)
          print((m.group(1).strip() if m else ''))
          PY
          )
          fi
          if [ -n "$SCHEME" ]; then BUILD_SELECTOR=(-scheme "$SCHEME"); echo "Build by scheme: $SCHEME"; elif [ -n "$TARGET" ]; then BUILD_SELECTOR=(-target "$TARGET"); echo "Build by target: $TARGET"; else echo "No scheme or native target found"; exit 1; fi
          xcodebuild "${CONTAINER_ARGS[@]}" "${BUILD_SELECTOR[@]}" -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$PWD/build/DerivedData" clean build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" ONLY_ACTIVE_ARCH=NO 2>&1 | tee build/xcodebuild.log

      - name: Package unsigned IPA
        run: |
          set -e
          APP_PATH=$(find build/DerivedData -path "*/Build/Products/Release-iphoneos/*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then echo "No .app found"; find build/DerivedData -maxdepth 8 -type d | tail -80; exit 1; fi
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          SAFE_TASK_NO="${TASK_NO:-manual}"
          zip -qry "../unsigned-${SAFE_TASK_NO}.ipa" Payload
          cd ../..
          ls -lah build/*.ipa

      - name: Upload build logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          if-no-files-found: warn
          path: |
            build/xcodebuild.log
            build/xcodebuild-list.log
            /tmp/inputs.json
            package.zip

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ios-ipa
          path: build/*.ipa
name: iOS WebView Cloud Build

on:
  workflow_dispatch:
    inputs:
      package_url:
        description: Xcode 工程 ZIP 下载地址
        required: true
      app_name:
        description: App 显示名称
        required: false
      bundle_id:
        description: Bundle Identifier
        required: false
      web_url:
        description: WebView 网址，可替换 Swift 中的 {{WEB_URL}} 或默认示例地址
        required: false
      task_no:
        description: 后台任务编号
        required: false

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Download source package
        run: |
          curl -L "${{ github.event.inputs.package_url }}" -o package.zip
          mkdir -p source
          unzip -q package.zip -d source
          find source -maxdepth 3 -type f | head -50

      - name: Patch app metadata
        run: |
          APP_NAME="${{ github.event.inputs.app_name }}"
          BUNDLE_ID="${{ github.event.inputs.bundle_id }}"
          WEB_URL="${{ github.event.inputs.web_url }}"
          if [ -n "$BUNDLE_ID" ]; then
            find source -name project.pbxproj -exec sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID/g" {} \;
          fi
          if [ -n "$WEB_URL" ]; then
            grep -RIl "{{WEB_URL}}\|https://kuangjia2.wenanku.cc/" source --include='*.swift' | xargs -I{} sed -i '' "s#{{WEB_URL}}#$WEB_URL#g; s#https://kuangjia2.wenanku.cc/#$WEB_URL#g" {}
          fi
          if [ -n "$APP_NAME" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName $APP_NAME" $(find source -name Info.plist | head -1) || true
          fi

      - name: Install signing certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build archive and export IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: |
          PROJECT=$(find source -name "*.xcodeproj" | head -1)
          if [ -z "$PROJECT" ]; then echo "No .xcodeproj found"; exit 1; fi
          SCHEME=$(xcodebuild -list -project "$PROJECT" | awk '/Schemes:/{getline; gsub(/^ +| +$/, ""); print; exit}')
          if [ -z "$SCHEME" ]; then echo "No scheme found"; exit 1; fi
          BUNDLE_ID="${{ github.event.inputs.bundle_id }}"
          if [ -z "$BUNDLE_ID" ]; then BUNDLE_ID=$(grep -m1 "PRODUCT_BUNDLE_IDENTIFIER" "$PROJECT/project.pbxproj" | sed 's/.*= //;s/;//;s/ //g'); fi
          mkdir -p build
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>development</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROVISIONING_PROFILE_NAME</string></dict>
            <key>stripSwiftSymbols</key><true/>
            <key>compileBitcode</key><false/>
          </dict></plist>
          EOF
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration Release -destination 'generic/platform=iOS' -archivePath "$PWD/build/App.xcarchive" archive DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
          xcodebuild -exportArchive -archivePath "$PWD/build/App.xcarchive" -exportOptionsPlist ExportOptions.plist -exportPath "$PWD/build/ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ github.event.inputs.task_no }}
          path: build/ipa/*.ipa

name: iOS WebView Unsigned Build

on:
  workflow_dispatch:
    inputs:
      package_url:
        description: Xcode 工程 ZIP 下载地址
        required: true
      app_name:
        description: App 显示名称
        required: false
      bundle_id:
        description: Bundle Identifier
        required: false
      web_url:
        description: WebView 网址，可替换 Swift 中的 {{WEB_URL}} 或默认示例地址
        required: false
      task_no:
        description: 后台任务编号
        required: false

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Download source package
        run: |
          curl -L "${{ github.event.inputs.package_url }}" -o package.zip
          mkdir -p source
          unzip -q package.zip -d source
          find source -maxdepth 4 -type f | head -80

      - name: Patch app metadata
        run: |
          APP_NAME="${{ github.event.inputs.app_name }}"
          BUNDLE_ID="${{ github.event.inputs.bundle_id }}"
          WEB_URL="${{ github.event.inputs.web_url }}"
          if [ -n "$BUNDLE_ID" ]; then
            find source -name project.pbxproj -exec sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID/g" {} \;
          fi
          if [ -n "$WEB_URL" ]; then
            grep -RIl "{{WEB_URL}}\|https://kuangjia2.wenanku.cc/" source --include='*.swift' | xargs -I{} sed -i '' "s#{{WEB_URL}}#$WEB_URL#g; s#https://kuangjia2.wenanku.cc/#$WEB_URL#g" {}
          fi
          if [ -n "$APP_NAME" ]; then
            INFO_PLIST=$(find source -name Info.plist | head -1)
            if [ -n "$INFO_PLIST" ]; then
              /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName $APP_NAME" "$INFO_PLIST" || true
              /usr/libexec/PlistBuddy -c "Set :CFBundleName $APP_NAME" "$INFO_PLIST" || true
            fi
          fi

      - name: Build unsigned app
        run: |
          set -e
          PROJECT=$(find source -name "*.xcodeproj" | head -1)
          if [ -z "$PROJECT" ]; then echo "No .xcodeproj found"; exit 1; fi
          SCHEME=$(xcodebuild -list -project "$PROJECT" | awk '/Schemes:/{getline; gsub(/^ +| +$/, ""); print; exit}')
          if [ -z "$SCHEME" ]; then echo "No scheme found"; exit 1; fi
          mkdir -p build
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/DerivedData" \
            clean build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package unsigned IPA
        run: |
          set -e
          APP_PATH=$(find build/DerivedData -path "*/Build/Products/Release-iphoneos/*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then echo "No .app found"; find build/DerivedData -maxdepth 8 -type d | tail -50; exit 1; fi
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -qry "../unsigned-${{ github.event.inputs.task_no }}.ipa" Payload
          cd ../..
          ls -lah build/*.ipa

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ios-ipa-${{ github.event.inputs.task_no }}
          path: build/*.ipa
